# =============================================================================
# Nginx config for Azure App Service — Linux, PHP 8.x blessed image.
# =============================================================================
# Azure's Linux PHP images serve through NGINX, not Apache. The .htaccess in
# this repo is therefore DEAD on Azure — every rule it carried (directory
# listing off, extensionless URLs, blocking .sql/.md/dotfiles, blocking the
# unauthenticated installer/wipe scripts) is re-implemented here.
#
# Installed by deploy/startup.sh, which must be set as the App Service
# "Startup Command".  See DEPLOY-AZURE.md.
# =============================================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name  _;
    root /home/site/wwwroot;
    index index.php index.html;

    port_in_redirect off;
    absolute_redirect off;

    # No directory listings (Options -Indexes).
    autoindex off;

    client_max_body_size 32M;

    # ---- Hard blocks --------------------------------------------------------

    # Dotfiles: .env, .git, .htaccess, .gitignore ... Must come first.
    location ~ /\. {
        deny all;
        return 404;
    }

    # DB dumps, docs, spreadsheets, archives.
    location ~* \.(sql|md|zip|xlsx|xls|docx|log|bak|orig|dump|pem|key)$ {
        deny all;
        return 404;
    }

    # The whole migrations/seeds tree.
    location ^~ /database/ {
        deny all;
        return 404;
    }

    # Uploaded KYC/merchant documents are served through the login-gated
    # api/sales/documents.php proxy — never directly.
    location ^~ /data/documents/ {
        deny all;
        return 404;
    }

    # Unauthenticated installers, demo seeders, password resets and the
    # data-wipe/cutover scripts. These are also .gitignore'd so they should
    # not be on the box at all — this is the second layer.
    location ~* ^/(setup|sales-setup|create-users|create-dept-managers|create-service-users|create-service-sample-data|seed-chat|seed-legal|reset-dev-passwords|production-cutover|production-wipe-keep-admin|simulate-incoming-call)\.php$ {
        deny all;
        return 404;
    }
    location ^~ /scripts/ {
        deny all;
        return 404;
    }
    # Cron entrypoints. Azure App Service (Linux) has no cron daemon, so these
    # must be reachable over HTTPS for an external scheduler (Azure Logic App /
    # Function timer, or curl from a box that does have cron).
    # Access is gated in PHP by cron/_cron_guard.php, which requires the
    # CRON_TOKEN app setting and fails closed when it is not set — do not rely
    # on this block alone. Only the known entrypoints are exposed; the shared
    # guard itself and anything else under /cron/ stays blocked.
    location ~ ^/cron/(run-sales-automations|run-escalations|run-daily-alerts|run-compliance-reminders|fetch-call-recordings)\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 600;
    }
    location ^~ /cron/ {
        deny all;
        return 404;
    }

    # ---- Routing ------------------------------------------------------------

    # Extensionless URLs: /sales-leads -> /sales-leads.php  (RewriteRule in .htaccess)
    location / {
        try_files $uri $uri/ @extensionless;
    }
    location @extensionless {
        rewrite ^/([A-Za-z0-9_-]+)/?$ /$1.php last;
        return 404;
    }

    # ---- Public chatbot (framed by payg.in) ---------------------------------
    # chat.php is loaded in a cross-origin <iframe> by the widget on payg.in
    # (chat-widget.js). It must therefore NOT carry X-Frame-Options/DENY —
    # frame-ancestors below is the allow-list. Exact-match location so it wins
    # over the generic \.php regex block below.
    # Add any new parent domain here AND to allowedOrigins in payg.in's page.
    location = /chat.php {
        add_header Content-Security-Policy "frame-ancestors 'self' https://payg.in https://www.payg.in https://uat.payg.in https://dev.payg.in" always;
        add_header X-Content-Type-Options "nosniff" always;

        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/chat.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 300;
    }

    # The widget script itself is fetched cross-origin by payg.in via <script src>.
    # <script src> is not CORS-gated, but keep it explicitly cacheable + framable-safe.
    location = /chat-widget.js {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # ---- PHP ----------------------------------------------------------------
    location ~ [^/]\.php(/|$) {
        # Everything except the chatbot refuses to be framed.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param HTTP_PROXY      "";

        # App Service terminates TLS at the front end and forwards over http.
        # Without this, payg_is_https() returns false and session cookies are
        # issued WITHOUT the Secure flag. X-Forwarded-Proto is set by the
        # front end and is what payg_is_https() checks.
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;

        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # 404 rather than handing an unmatched path to PHP.
        if (!-f $document_root$fastcgi_script_name) { return 404; }
    }

    # ---- Static -------------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|svg|ico|webp|css|js|woff|woff2|ttf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
