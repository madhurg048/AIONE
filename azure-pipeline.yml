trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:

# 🧰 Check PHP
- script: php -v
  displayName: 'Check PHP Version'

# 📦 Install dependencies
- script: |
    composer install --no-dev --optimize-autoloader
  displayName: 'Install Composer Dependencies'

# 📁 Prepare Laravel
- script: |
    cp .env.example .env
    php artisan key:generate
  displayName: 'Prepare Laravel App'

# 📂 Copy only required Laravel files
- task: CopyFiles@2
  inputs:
    contents: |
      public/**
      vendor/**
      app/**
      bootstrap/**
      config/**
      database/**
      resources/**
      routes/**
      storage/**
      artisan
      composer.json
      composer.lock
    targetFolder: '$(Build.ArtifactStagingDirectory)'

# 📦 Archive ONLY copied files (IMPORTANT FIX)
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)'   # ✅ FIXED
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/laravel.zip'
    replaceExistingArchive: true
    excludeFiles: |
      hostingstart.html

- script: |
    echo "" > $(Build.ArtifactStagingDirectory)/.env
  displayName: 'Write empty .env to artifact'

# 📤 Publish artifact
- publish: '$(Build.ArtifactStagingDirectory)/laravel.zip'
  artifact: drop